name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Check isolated React frontend
        run: npm run check:react

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end checks
        run: npm run check:e2e

      - name: Check React frontend through Fastify
        run: npx playwright test --config playwright.react.config.ts
