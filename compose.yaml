name: messenger-handoff

services:
  app:
    build:
      context: .
    environment:
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      CLOSED_REQUEST_RETENTION_DAYS: '${CLOSED_REQUEST_RETENTION_DAYS:-7}'
      DATABASE_PATH: /app/data/messenger-handoff.sqlite
      HOST: 0.0.0.0
      HTTP_TRUSTED_PROXIES: '${APP_NETWORK_GATEWAY:-172.30.1.1}/32'
      INSTANCE_ID: '${INSTANCE_ID:-default}'
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 3000
      TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN:-}'
      TELEGRAM_ENABLED: '${TELEGRAM_ENABLED:-false}'
      TELEGRAM_OPERATOR_CHAT_ID: '${TELEGRAM_OPERATOR_CHAT_ID:-}'
      TELEGRAM_POLL_TIMEOUT_SECONDS: '${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}'
      TELEGRAM_PROXY_URL: '${TELEGRAM_PROXY_URL:-}'
      VK_ACCESS_TOKEN: '${VK_ACCESS_TOKEN:-}'
      VK_ENABLED: '${VK_ENABLED:-false}'
      VK_GROUP_ID: '${VK_GROUP_ID:-}'
      VK_POLL_TIMEOUT_SECONDS: '${VK_POLL_TIMEOUT_SECONDS:-25}'
    ports:
      - '127.0.0.1:${HOST_PORT:-3101}:3000'
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped
    volumes:
      - messenger-handoff-data:/app/data

  backup:
    profiles: ['operations']
    build:
      context: .
    command: ['node', 'dist/create-external-backup.js']
    environment:
      BACKUP_ALERT_BEARER_TOKEN: '${BACKUP_ALERT_BEARER_TOKEN:-}'
      BACKUP_ALERT_WEBHOOK_URL: '${BACKUP_ALERT_WEBHOOK_URL}'
      BACKUP_EXPORT_PATH: /backup
      BACKUP_TIMEOUT_SECONDS: '${BACKUP_TIMEOUT_SECONDS:-10}'
      CLOSED_REQUEST_RETENTION_DAYS: '${CLOSED_REQUEST_RETENTION_DAYS:-7}'
      DATABASE_PATH: /app/data/messenger-handoff.sqlite
      INSTANCE_ID: '${INSTANCE_ID:-default}'
    restart: 'no'
    volumes:
      - messenger-handoff-data:/app/data:ro
      - '${BACKUP_HOST_PATH}:/backup'

volumes:
  messenger-handoff-data:

networks:
  default:
    ipam:
      config:
        - subnet: '${APP_NETWORK_SUBNET:-172.30.1.0/24}'
          gateway: '${APP_NETWORK_GATEWAY:-172.30.1.1}'
