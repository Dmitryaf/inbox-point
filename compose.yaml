name: messenger-handoff

services:
  app:
    build:
      context: .
    environment:
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      CLOSED_REQUEST_RETENTION_DAYS: '${CLOSED_REQUEST_RETENTION_DAYS:-7}'
      DATABASE_PATH: /app/data/messenger-handoff.sqlite
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 3000
      TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN:-}'
      TELEGRAM_ENABLED: '${TELEGRAM_ENABLED:-false}'
      TELEGRAM_OPERATOR_CHAT_ID: '${TELEGRAM_OPERATOR_CHAT_ID:-}'
      TELEGRAM_POLL_TIMEOUT_SECONDS: '${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}'
      VK_ACCESS_TOKEN: '${VK_ACCESS_TOKEN:-}'
      VK_ENABLED: '${VK_ENABLED:-false}'
      VK_GROUP_ID: '${VK_GROUP_ID:-}'
      VK_POLL_TIMEOUT_SECONDS: '${VK_POLL_TIMEOUT_SECONDS:-25}'
    ports:
      - '127.0.0.1:${HOST_PORT:-3101}:3000'
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped
    volumes:
      - messenger-handoff-data:/app/data

volumes:
  messenger-handoff-data:
